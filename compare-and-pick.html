<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2026-11-27 블프 5채널 — 비교·선택·편집</title>
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#16181d; --muted:#6b7280; --line:#e3e6ec;
  --brand:#2f6df6; --brand-soft:#eaf0ff; --ok:#0f9d58; --warn:#c2410c;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  line-height:1.6;font-size:15px;padding-bottom:190px}
header{background:#fff;border-bottom:1px solid var(--line);padding:18px 16px 14px}
h1{font-size:19px;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:13px;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
.pill{display:inline-block;font-size:12px;background:var(--brand-soft);color:var(--brand);
  border-radius:999px;padding:2px 9px;margin-right:6px}
details.prompt{background:#fff;border:1px solid var(--line);border-radius:12px;margin:14px 0}
details.prompt summary{cursor:pointer;padding:12px 14px;font-weight:600;font-size:14px;list-style:none}
details.prompt summary::-webkit-details-marker{display:none}
details.prompt summary::before{content:"▸";margin-right:7px;color:var(--muted)}
details.prompt[open] summary::before{content:"▾"}
.prompt-body{padding:0 14px 14px}
pre.prompt{background:#0f1115;color:#e8eaef;border-radius:10px;padding:14px;
  font-size:12.5px;line-height:1.65;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word;margin:0 0 10px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px;position:sticky;top:0;
  background:var(--bg);z-index:5;-webkit-overflow-scrolling:touch}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;
  padding:8px 14px;font-size:13.5px;font-weight:600;color:#3d424e;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{background:var(--brand);border-color:var(--brand);color:#fff}
.chead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:16px 0 10px}
.chead h2{font-size:17px;margin:0}
.chead span{color:var(--muted);font-size:13px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;
  overflow:hidden;min-height:280px}
.card.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.card.pick .badge{background:#fff7ed;color:var(--warn)}
.cbar{display:flex;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--line);
  position:sticky;top:0;background:#fff;z-index:2}
.badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:#eef0f4;color:#3d424e}
.cmeta{font-size:11.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cbody{padding:12px;font-size:13px;line-height:1.72;overflow:auto;max-height:440px;flex:1;
  word-break:break-word;overflow-wrap:anywhere}
.cbody h1,.cbody h2,.cbody h3,.cbody h4{font-size:13.5px;margin:12px 0 5px;letter-spacing:-.01em}
.cbody h1:first-child,.cbody h2:first-child{margin-top:0}
.cbody p{margin:0 0 7px}
.cbody ul{margin:0 0 8px;padding-left:18px}
.cbody li{margin:1px 0}
.cbody hr{border:0;border-top:1px dashed var(--line);margin:11px 0}
.cbody table{width:100%;border-collapse:collapse;margin:6px 0 10px;font-size:11.5px;display:block;overflow-x:auto}
.cbody th,.cbody td{border:1px solid var(--line);padding:4px 6px;vertical-align:top;text-align:left}
.cbody th{background:#f3f5f9;white-space:nowrap}
.cbody strong{font-weight:700}
.cbody em{color:var(--muted)}
.cbody code{background:#f1f3f7;border-radius:4px;padding:0 3px;font-size:12px}
.cfoot{padding:10px 12px;border-top:1px solid var(--line);background:#fbfcfe}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 12px;font-size:13px;
  font-weight:600;cursor:pointer;color:#2b2f38}
.btn:hover{background:#f3f5f9}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.on{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.small{padding:5px 9px;font-size:12px;border-radius:8px}
.editor{background:#fff;border:1px solid var(--line);border-radius:14px;margin:14px 0 0;padding:12px}
.editor h3{font-size:14px;margin:0 0 4px}
.editor .hint{font-size:12px;color:var(--muted);margin:0 0 9px}
textarea{width:100%;min-height:340px;border:1px solid var(--line);border-radius:10px;padding:12px;
  font-family:ui-monospace,SFMono-Regular,Menlo,"Droid Sans Mono",monospace;font-size:12.5px;line-height:1.7;
  resize:vertical;background:#fcfdff;color:var(--ink)}
.erow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.saved{font-size:12px;color:var(--ok);font-weight:600;opacity:0;transition:opacity .2s}
.saved.show{opacity:1}
.dock{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);
  border-top:1px solid var(--line);backdrop-filter:blur(8px);z-index:20;padding:9px 0 11px;
  box-shadow:0 -6px 20px rgba(16,18,24,.05)}
.dock .wrap{display:flex;flex-direction:column;gap:7px}
.dock-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
.dock-head .cnt{color:var(--muted);font-weight:500;font-size:12px}
.sumrow{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:#f4f6fa;border:1px solid var(--line);
  border-radius:999px;padding:5px 6px 5px 11px;font-size:12px}
.chip b{font-weight:700}
.chip .who{color:var(--brand);font-weight:700}
.chip button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 8px;font-size:11.5px;cursor:pointer}
.dockbtns{display:flex;gap:8px}
.dockbtns .btn{flex:1}
@media (min-width:760px){ .dockbtns{flex:0 0 auto;justify-content:flex-end} .dock .wrap{flex-direction:row;align-items:center}
  .sumrow{flex:1} .dock-head{flex:0 0 auto} }
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:200px;background:#16181d;color:#fff;
  padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
.toast.show{opacity:.95}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1 id="ttl"></h1>
    <p class="sub" id="sub"></p>
  </div>
</header>

<div class="wrap">
  <details class="prompt" id="promptBox">
    <summary>3개 AI 공통 프롬프트 보기 · 복사 (그대로 붙여넣으면 같은 형식으로 받습니다)</summary>
    <div class="prompt-body">
      <pre class="prompt" id="promptPre"></pre>
      <button class="btn primary small" id="copyPrompt">프롬프트 복사</button>
    </div>
  </details>

  <div class="tabs" id="tabs" role="tablist"></div>
  <div id="panel"></div>
</div>

<div class="dock">
  <div class="wrap">
    <div class="dock-head">선택 결과 <span class="cnt" id="pickCnt"></span></div>
    <div class="sumrow" id="sumrow"></div>
    <div class="dockbtns">
      <button class="btn small" id="copyAll">전체 복사</button>
      <button class="btn small primary" id="download">.md 다운로드</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="application/json" id="data">{
 "title": "2026 블랙프라이데이 5채널 — 4버전 비교 · 선택 · 편집",
 "date": "2026-11-27",

     "text": "# 제목 후보 (1개 선택)\n1. **블랙프라이데이 마감일 확인하고 패딩 세일 지나간 11월 가계부**\n2. 블랙프라이데이 마감일 앞두고 장바구니 비운 날 (패딩 세일 후기)\n3. 블랙프라이데이 마감일이 쇼핑몰마다 다른 이유, 제 기준 3가지\n\n---\n\n## 본문\n\n11월 마지막 주가 되니 스마트폰 알림이 전부 세일 이야기입니다. '최대 70% 할인', '오늘이 블랙프라이데이' 같은 문구를 보고 있으면 당장 장바구니를 털어야 손해 보는 기분이 듭니다. 저도 어제 퇴근길에 겨울 패딩 하나 보려다가 결제 직전까지 갔는데, 잠깐 멈춰서 가계부부터 열어 봤습니다.\n\n막상 세일 기간을 따져 보니 정작 중요한 건 할인율이 아니라 블랙프라이데이 마감일이었습니다. 오늘이 당일인데도 국내 쇼핑몰은 끝나는 날짜가 다 제각각이더군요. 쿠팡 블랙프라이데이(가전·디지털)와 롯데·현대·신세계백화점 겨울 정기세일은 11월 29일에 끝납니다. 무신사 무진장 26 겨울은 12월 2일, 에이블리와 알리익스프레스는 12월 3일이 마감입니다.\n\n주말에 천천히 고르면 되겠지 싶다가도, 이틀 뒤에 끝나는 행사를 보고 나면 조급해져서 안 사도 될 물건까지 담기 쉽습니다. 패딩 세일 배너가 하루에도 몇 번씩 뜨는데 마감이 코앞이라고 생각하면 판단이 흐려지더군요.\n\n![블프 마감일 확인하다 늦은 밤](projects/content-studio/daily/2026-11-27/naver-blog-cover.png)\n\n## 남들 다 살 때 왜 패딩에 돈이 몰렸을까\n\n이번 주 유통가 기사를 찾아보니 사람들이 지갑을 연 이유가 단순히 세일 때문만은 아니었습니다. 서울 최저기온이 영하 5.8도까지 내려가자 한파 수요가 한꺼번에 몰린 겁니다.\n\n- 신세계백화점은 11월 19~24일 아웃도어 매출이 직전 주 같은 요일보다 35%, 스포츠는 30% 늘었습니다.\n- 무신사 무진장 26 겨울 블랙프라이데이는 행사 시작 43시간 만에 누적 판매 1,000억 원을 넘겼습니다. 지난해 겨울 행사보다 6시간 빠른 속도입니다.\n- 11월 23일 하루에만 패딩·코트 같은 외투가 200억 원어치 팔렸고, 다음 날 오전 8시 외투 순위 상위 9개 중 7개가 패딩이었습니다.\n- 코오롱몰도 11월 1~18일 다운·패딩 거래액이 작년 같은 기간의 3.5배를 기록했습니다.\n\n문제는 이런 분위기일수록 '남들 다 사니까 나도 하나' 하는 심리가 붙는다는 점입니다. 블프 충동구매는 대개 이 지점에서 시작됩니다. 기사에 나온 프리미엄 다운은 50만~110만원대가 상위였고, 온라인 랭킹 1~3위는 4만~7만원대 경량·미드웨이트 패딩이었습니다. 가격 차이가 열 배 넘게 나는데도 세일 배너만 보면 일단 비싼 쪽에 눈이 가기 마련입니다.\n\n## 가계부 지키려고 세운 결제 기준 3가지\n\n그래서 이번 블프에는 장바구니에 넣기 전에 세 가지만 통과한 물건만 결제하기로 정했습니다.\n\n1. 할인 전 평소 가격부터 확인하기. 세일 기간 직전에 정가가 올라간 경우도 있어서, 어제 가격이나 타 사이트 가격과 비교하지 않으면 '가짜 할인'에 걸리기 쉽습니다.\n2. 이번 겨울 최소 10번 이상 손이 갈 물건만 사기. 싸다고 들인 옷이 옷장에 걸려만 있으면 그게 제일 비싼 지출입니다.\n3. 11월 고정지출·카드값 먼저 빼고 남은 예산 안에서만 고르기. 다음 달 카드값 생각하면 4만~7만원대 실속형으로 충분한지, 꼭 고가 라인이 필요한지 바로 답이 나옵니다.\n\n기준을 적어 두고 장바구니를 다시 열어 보니, 카드값과 관리비가 빠져나간 뒤 남는 금액이 생각보다 적었습니다. 그 예산으로 50만 원대 다운재킷까지 가는 건 무리라는 계산이 금방 나왔고, 원래 보던 5만~7만원대 경량 패딩만 남았습니다. 패딩 세일은 다음 달에도 또 오니까요. 블랙프라이데이 마감일이 지나면 정가로 돌아간다는 것도 크게 아쉽지 않았습니다.\n\n가계부 방어는 결제 버튼을 누르기 전 한 번 더 계산하는 일이더군요.\n\n이렇게 걸러 내고 나니 처음 담았던 품목 절반 이상이 빠졌습니다.\n\n## 이번 주에 끝나는 블프 일정 메모\n\n필요한 게 정말 있다면 마감 직전 품절 전에만 챙기시면 됩니다. 무신사 무진장처럼 인기 상품이 몰리는 행사는 블랙프라이데이 마감일보다 사이즈 소진이 먼저 오더군요.\n\n- 11/29 · 쿠팡 블랙프라이데이(가전·디지털), 롯데·현대·신세계 겨울 정기세일\n- 11/30 · 롯데하이마트, 오늘의집 '집요한세일', 코오롱몰 '아우터 위크'\n- 12/1 · 쿠팡 R.LUX 패션 행사\n- 12/2 · 무신사 '무진장 26 겨울'\n- 12/3 · 에이블리 '에블프', 알리익스프레스\n\n이번 블랙프라이데이 마감일은 다들 어떻게 챙기셨나요. 가계부 방어에 성공하셨는지, 아니면 꼭 필요했던 물건을 득템하셨는지 궁금합니다. 여러분만의 블프 충동구매 막는 기준이 있다면 댓글로 공유해 주세요.\n\n---",

     "text": "## 제목\n\n2026 블랙프라이데이, 패딩 할인보다 마감일을 먼저 확인한 이유\n\n## 제목 후보\n\n- 2026 블랙프라이데이, 패딩 사기 전에 확인해야 할 세일 종료일\n- 블프 당일인데 아직 안 끝났다? 국내 겨울 세일 일정 정리\n- 패딩 할인 놓치기 싫다면 11월 27일 꼭 확인할 것\n\n## 본문\n\n블랙프라이데이라고 하면 일단 가격부터 확인하게 된다. 나 역시 할인율이 얼마나 되는지, 평소 눈여겨보던 패딩이 얼마나 내려갔는지부터 찾아보는 편이다.\n\n그런데 올해는 조금 다르게 접근하기로 했다.\n\n오늘은 11월 27일 금요일. 블랙프라이데이 당일이다. 그런데 국내 쇼핑 행사를 살펴보다 보니 이상한 점이 있었다. 행사마다 끝나는 날짜가 전부 달랐다.\n\n처음에는 오늘이 지나면 대부분 끝나는 줄 알았는데, 실제로는 11월 말부터 12월 초까지 이어지는 행사가 있었다.\n\n**할인율보다 종료일을 먼저 봐야겠다고 생각한 이유다.**\n\n[이미지 위치: 2026년 블랙프라이데이 주요 행사 종료일을 한눈에 보여주는 달력 이미지]\n\n### 왜 올해는 패딩에 돈이 몰렸을까?\n\n이번 겨울 패션 소비에서 눈에 띄는 품목은 단연 패딩이다.\n\n무신사 무진장 26 겨울 행사는 11월 22일 오후 7시에 시작해 11월 24일 오후 2시, 43시간 만에 누적 판매액 1,000억 원을 넘어섰다. 지난해 겨울 행사보다 6시간 빠른 기록이다.\n\n11월 23일 하루 동안 외투 판매액은 200억 원, 신발은 100억 원이었다. 신발 판매액은 전년 대비 68% 증가했다.\n\n재미있는 부분은 인기 상품 구성이다.\n\n11월 24일 오전 8시 기준 외투 순위 상위 9개 중 7개가 패딩이었다. 그중 5개는 미드웨이트·라이트·경량 패딩이나 플리스, 후드 집업처럼 겹쳐 입기 좋은 제품이었다.\n\n두꺼운 패딩 하나보다 여러 옷을 조합하는 겨울 스타일에도 관심이 모인 것으로 보인다.\n\n가격 차이도 상당하다. 프리미엄 다운은 50만~110만 원대가 상위권이었고, 온라인 랭킹 상위권 경량·미드웨이트 패딩은 4만~7만 원대였다.\n\n### 내가 결제 전에 확인할 기준 3가지\n\n무조건 할인율이 높은 제품을 선택하지는 않으려고 한다.\n\n첫째, 실제로 입을 옷인지 확인한다. 이미 비슷한 패딩이 있다면 할인율이 높아도 추가 구매할 이유는 적다.\n\n둘째, 가격대를 따져본다. 프리미엄 다운과 경량 패딩은 용도가 다르기 때문에 단순 가격 비교만으로 판단하기 어렵다.\n\n셋째, 행사 종료일을 확인한다. 오늘 끝나는 행사인지, 며칠 더 남아 있는지에 따라 확인 순서가 달라진다.\n\n### 블랙프라이데이 마감 일정 메모\n\n- 11월 29일: 백화점 겨울 정기세일 종료\n- 11월 30일: 코오롱몰 아우터 위크 종료\n- 12월 2일: 무신사 무진장 26 겨울 종료\n\n백화점은 롯데 400여 브랜드, 신세계 370여 브랜드가 겨울 정기세일에 참여한다. 현대백화점은 패딩·코트 물량을 전년 대비 20% 확대했다.\n\n코오롱몰은 11월 1~18일 다운·패딩 거래액이 전년 동기 대비 3.5배를 기록했다.\n\n올해 블랙프라이데이는 당일 특가만 기다리기보다 행사별 종료일을 확인하는 게 먼저인 것 같다.\n\n**여러분은 이번 겨울 패딩을 고를 때 가격, 보온성, 디자인 중 어떤 기준을 가장 먼저 보시나요?**\n\n## 해시태그\n\n#블랙프라이데이 #2026블프 #패딩 #겨울세일 #무신사 #아우터 #짠테크 #소비습관",

     "text": "## 제목 후보 3개\n\n1. 2026 블랙프라이데이, 할인율보다 마감일 먼저 체크해야 가계부 지킵니다\n2. 블프 패딩 대란 속 충동구매 막아낸 내 돈 지키는 결제 기준 3가지\n3. 이번 주말 끝나는 블프 행사 정리, 사기 전 딱 3가지만 따져보세요\n\n## 본문(약 1,500자)\n\n11월 마지막 주 금요일인 오늘, 아침부터 스마트폰 알림창이 온통 '블랙프라이데이' 소식으로 가득 찼습니다. '최대 70% 할인', '단독 특가' 같은 자극적인 문구를 보고 있으니 가만히 있으면 손해 보는 기분이 들더군요. 어제 퇴근길 지하철에서도 올겨울 입을 패딩 하나 장만할까 싶어 쇼핑 앱을 켰다가, 결제 버튼을 누르기 직전 겨우 손을 멈추고 가계부 앱부터 열었습니다.\n\n할인율 숫자보다 무서운 건 제각각인 마감일. 장바구니에 담은 옷을 찬찬히 뜯어보니 진짜 급한 건 할인 퍼센트가 아니었습니다. 우리나라 블프는 미국처럼 하루 반짝하고 끝나는 행사가 아니라 플랫폼마다 문 닫는 날짜가 다릅니다. 당장 이번 주 일요일인 11월 29일에 끝나는 곳이 있는가 하면 12월 초까지 이어지는 곳도 있습니다. 이틀 뒤 마감이라는 빨간 숫자를 보면 당장 필요하지 않은 물건까지 '일단 사고 보자'는 심리로 결제하게 됩니다.\n\n(이미지 위치 1: 스마트폰 쇼핑 앱 장바구니 화면과 가계부 메모장을 나란히 둔 책상 사진)\n\n왜 유독 올해 겨울 패딩에 돈이 몰렸을까. 사람들이 지갑을 여는 속도가 예사롭지 않습니다. 지난 11월 22일 서울 최저기온이 영하 5.8도까지 뚝 떨어지면서 방한 의류 수요가 한꺼번에 터졌습니다. 실제 수치를 보면 더 놀랍습니다. 무신사 '무진장 26 겨울' 행사는 11월 22일 저녁 7시에 문을 연 지 43시간 만인 24일 오후 2시에 누적 판매액 1,000억 원을 넘어섰는데, 작년 겨울 행사보다 6시간이나 빠른 속도입니다. 11월 23일 하루 동안 외투만 200억 원, 신발은 전년 대비 68% 늘어난 100억 원어치가 팔렸습니다.\n\n백화점도 마찬가지입니다. 신세계백화점은 11월 19일부터 24일까지 아웃도어 매출이 전주 같은 요일보다 35%, 스포츠는 30% 뛰었습니다. 코오롱몰 역시 11월 1일부터 18일까지 다운·패딩 거래액이 작년 같은 기간의 3.5배로 불어났습니다. 50만~110만 원대 프리미엄 다운부터 온라인 랭킹 1~3위를 차지한 4만~7만 원대 경량·미드웨이트 패딩까지 양쪽으로 수요가 몰렸습니다. 남들이 다 산다는 분위기에 휩쓸리면 내 주머니 사정을 잊기 딱 좋습니다.\n\n충동구매를 막아낸 나만의 결제 기준 3가지. 세일 기간에 제값을 주고도 합리적인 소비를 했다고 착각하지 않으려고 세 가지 원칙을 세웠습니다. 첫째, 세일 전 평소 가격을 먼저 확인합니다. 정가를 높게 잡아두고 할인율만 크게 보이게 만든 상품은 거릅니다. 둘째, 이번 겨울에 최소 10번 이상 꺼내 입을 옷인지 따져봅니다. 무신사 외투 순위 상위 9개 중 7개가 패딩이고 그중 5개가 겹쳐 입기 좋은 경량·미드웨이트 패딩이나 플리스였다는 점은 시사하는 바가 큽니다. 한 번 멋 내고 옷장에 박아둘 옷보다 매일 손이 가는 실용적인 옷이 진짜 짠테크입니다. 셋째, 월급에서 고정지출과 다음 달 카드값을 먼저 떼어놓고 남은 11월 생활비 예산 안에서만 결제합니다. 예산이 부족하면 아무리 싼 특가라도 다음 기회로 미룹니다.\n\n(이미지 위치 2: 11월 29일부터 12월 13일까지 주요 쇼핑몰 블프 종료일을 정리한 달력 메모 이미지)\n\n놓치면 아쉬운 주요 행사 마감 일정 메모. 꼭 필요한 생필품이나 겨울 외투를 사기로 마음먹었다면 플랫폼별 종료일만 정확히 챙기면 됩니다.\n\n- 11월 29일(일): 백화점 겨울 정기세일(롯데·신세계·현대), 쿠팡 가전·디지털 블랙프라이데이\n- 11월 30일(월): 롯데하이마트, 오늘의집 '집요한세일', 코오롱몰 '아우터 위크'\n- 12월 1일(화): 쿠팡 R.LUX 패션\n- 12월 2일(수): 무신사 '무진장 26 겨울'\n- 12월 3일(목): 에이블리 '에블프', 알리익스프레스\n- 12월 13일(일): 신세계사이먼 '사이먼 블랙 프라이데이'\n\n여러분은 이번 블랙프라이데이 기간에 가계부 방어에 성공하셨나요, 아니면 오래 기다리던 물건을 알차게 득템하셨나요? 충동구매를 막는 본인만의 소비 기준이 있다면 댓글로 공유해 주세요.\n\n## 이미지 위치\n\n- 본문 두 번째 소제목 위: 스마트폰 쇼핑 앱 장바구니 화면과 가계부 메모장을 나란히 둔 책상 사진\n- 본문 네 번째 소제목 위: 11월 29일부터 12월 13일까지 주요 쇼핑몰 블프 종료일을 정리한 달력 메모 이미지\n\n## 해시태그\n\n#2026블랙프라이데이 #블프세일 #짠테크 #가계부관리 #겨울패딩추천 #충동구매방지 #무신사무진장 #백화점정기세일",

     "meta": "1,130자 · 해요체",
     "text": "## 제목 후보 3개\n\n- 블프 패딩 결제 직전에 멈추고 가계부부터 열었습니다\n- 할인율 말고 마감일부터 봤더니 장바구니가 반으로 줄었다\n- 이틀 뒤 끝나는 세일에 휘둘리지 않으려고 만든 나만의 기준\n\n## 본문\n\n11월 마지막 주가 되니 휴대폰 알림이 전부 세일이에요. '최대 70% 할인'이라는 문구가 뜰 때마다 괜히 마음이 급해집니다. 어제 퇴근길에도 겨울 패딩을 한참 들여다보다가 결제 버튼 바로 앞에서 손가락이 멈췄어요. 그러고는 쇼핑앱을 닫고 가계부 앱을 열었습니다.\n\n### 할인율보다 먼저 본 건 마감일이었다\n\n가계부를 보다가 이상한 점을 발견했어요. 제가 조급했던 이유는 할인율이 아니라 '끝나는 날'이었습니다. 이번 블프는 오늘 하루 반짝 특가가 아니에요. 행사마다 끝나는 날이 11/29, 12/2, 12/3으로 제각각입니다. 이틀 뒤에 끝난다는 문구를 보면 원래 살 생각이 없던 물건까지 담게 돼요. 같은 70% 할인이어도 마감이 코앞이면 판단이 거칠어지더라고요.\n\n(이미지 위치 ①: 가계부 앱 화면과 장바구니 캡처를 나란히 배치)\n\n### 왜 패딩에 돈이 몰렸나\n\n저만 패딩을 본 게 아니었어요. 서울 최저기온이 11/22에 -5.8도까지 내려갔고, 신세계백화점의 11/19~24 아웃도어 매출은 전주 같은 요일보다 35%, 스포츠는 30% 늘었습니다. 무신사는 행사 시작 43시간 만에 누적 판매 1,000억 원을 넘겼고요. 11/23 하루에만 외투가 200억 원어치 팔렸습니다. 가격대는 프리미엄 다운이 50만~110만원대, 온라인 랭킹 1~3위는 4만~7만원대 경량·미드웨이트 패딩이에요. 숫자를 보니 '남들 다 사니까 나도'라는 마음이 어디서 올라왔는지 알겠더군요.\n\n### 내가 정한 결제 기준 3가지\n\n- 할인 전 평소 가격부터 확인한다. 가격이 올랐다 내려온 '가짜 할인'인지 먼저 본다.\n- 이번 겨울에 10번 이상 입을 물건만 산다.\n- 고정지출과 카드값을 빼고 남은 11월 예산 안에서만 쓴다.\n\n### 이번 주 마감 일정 메모\n\n- 11/29: 쿠팡 가전·디지털 블랙프라이데이, 백화점 겨울 정기세일\n- 11/30: 롯데하이마트, 오늘의집 '집요한세일', 코오롱몰 '아우터 위크'\n- 12/1: 쿠팡 R.LUX 패션\n- 12/2: 무신사 '무진장 26 겨울'\n- 12/3: 에이블리 '에블프', 알리익스프레스\n\n(이미지 위치 ②: 위 일정을 손글씨 메모 사진처럼 정리한 이미지)\n\n여러분은 이번 블프에 가계부를 지켜내셨나요, 아니면 득템하셨나요? 충동구매를 막는 나만의 기준이 있다면 댓글로 알려주세요.\n\n## 해시태그\n\n#블랙프라이데이 #블프마감일 #패딩추천 #짠테크 #가계부 #충동구매 #겨울아우터 #세정아빠",

     "key": "pickle",

     "text": "# 블랙프라이데이 마감일: 11/29·12/2·12/3 종료일 정리\n\n2026년 11월 27일(금)은 블랙프라이데이 당일입니다. 다만 실제로 챙길 숫자는 시작일이 아니라 블랙프라이데이 마감일입니다. 2026 블랙프라이데이 기간은 11월 29일부터 12월 13일까지로 행사마다 다르고, 하루 차이로 같은 상품을 할인가로 못 삽니다. 마감일은 11월 24~27일 보도로 확인했습니다.\n\n## 1. 행사별 종료일\n\n### 11월 29일에 끝나는 행사\n\n| 채널 | 종료일 | 확인된 내용 |\n|---|---|---|\n| 쿠팡 | 11/29 | 가전·디지털, 삼성·LG·인텔 참여 |\n| 롯데·현대·신세계백화점 | 11/29 | 겨울 정기세일, 롯데 400여·신세계 370여 브랜드, 현대 패딩 물량 20% 확대 |\n\n### 11월 30일~12월 13일에 끝나는 행사\n\n| 채널 | 종료일 | 확인된 내용 |\n|---|---|---|\n| 롯데하이마트 | 11/30 | 블랙프라이데이 |\n| 오늘의집 | 11/30 | '집요한세일', 최저가 미달 차액 200%P |\n| 코오롱몰 | 11/30 | '아우터 위크', 본행사 거래액 전년 대비 2.1배 |\n| 쿠팡 | 12/1 | R.LUX 패션 |\n| 무신사 | 12/2 | '무진장 26 겨울', 1,500여 개·오프라인 11곳 |\n| 에이블리 | 12/3 | '에블프', 입점사 2,000여 곳·최대 93% |\n| 알리익스프레스 | 12/3 | 연말 할인전, 최대 70% |\n| 신세계사이먼 | 12/13 | 프리미엄 아울렛 전 점포 |\n\n겨울 정기세일 종료일은 백화점 세 곳 모두 11월 29일, 무신사 무진장 기간은 12월 2일입니다. 11월 30일은 가전·가구·패션이 겹칩니다.\n\n![세일 마감일을 확인하는 저녁](projects/content-studio/daily/2026-11-27/naver-blog-cover.png)\n\n## 2. 이번 주 수요 숫자\n\n- 신세계백화점 아웃도어 매출은 11/19~24 전주 같은 요일 대비 35%, 스포츠 30% 늘었습니다.\n- 무신사는 11/22 19시 시작 후 43시간(11/24 14시) 만에 1,000억 원을 넘겼습니다. 지난해보다 6시간 빠릅니다.\n- 11/23 외투 200억·신발 100억(전년 대비 68%↑), 11/24 08시 외투 상위 9개 중 7개가 패딩이었습니다.\n- 코오롱몰 다운·패딩 거래액은 11/1~18 전년 동기 3.5배, 앱 매출 비중 79%였습니다.\n- 서울 최저기온은 11/22 영하 5.8도까지 내려갔습니다.\n\n팔린 것은 비싼 한 벌이 아니라 겹쳐 입는 조합이었습니다(상위 9개 중 5개가 미드웨이트·경량 패딩, 플리스·후드 집업). 수요는 기온이 떨어질 때 바로 움직였고, 랭킹 1~3위 4만~7만원대와 프리미엄 다운 50만~110만원대는 열 배 차이입니다.\n\n## 3. 결제 전 체크리스트와 30일 실행 표\n\n### 결제 전 체크리스트\n\n- [ ] 이번 겨울에 몇 번 입을지 숫자로 적었는가\n- [ ] 행사 종료일을 확인했는가 (표 날짜는 연장될 수 있음)\n- [ ] 배송비·쿠폰까지 반영한 최종 결제 금액으로 비교했는가\n- [ ] 3주 전 가격보다 실제로 내려갔는가\n- [ ] 내 사이즈 재고가 남아 있는가 (인기 사이즈는 먼저 소진)\n- [ ] 반품·교환 조건을 확인했는가 (세일 상품은 교환 불가가 흔함)\n\n패딩 구매 체크리스트에서 자주 걸리는 건 세 번째 항목입니다. 표시 할인율은 정가 기준이라 쿠폰 유무에 따라 실제 차액이 뒤집힙니다.\n\n### 30일 실행 표\n\n| 기간 | 실행 내용 | 확인 지표 |\n|---|---|---|\n| 11/27~11/29 | 품목 3개만 추리고 최종 결제 금액 비교 | 장바구니 3개 이하 |\n| 11/30~12/3 | 남은 행사 종료일·사이즈 재고 확인 후 결제 | 결제 2건 이하 |\n| 12/4~12/13 | 아울렛·연장 행사 가격 재확인, 반품 기간 점검 | 반품      "text": "## 제목\n\n2026 블랙프라이데이 마감일 총정리 및 쇼핑 전 필수 체크리스트\n\n## 본문(약 1,800자)\n\n매년 11월 넷째 주 금요일은 글로벌 쇼핑 대목인 블랙프라이데이다. 2026년 11월 27일 금요일을 기점으로 국내 주요 이커머스와 백화점, 아울렛의 연말 대규모 할인전이 절정에 달했다. 국내 유통업계의 블랙프라이데이는 단 하루 반짝 할인하는 방식이 아니라 플랫폼별로 일주일에서 보름가량 이어지며 종료 시점이 모두 다르다. 따라서 성공적인 쇼핑을 위해서는 할인율보다 각 행사의 정확한 종료일을 먼저 파악해야 한다.\n\n### 1. 2026 국내 주요 플랫폼 블랙프라이데이 종료 일정\n\n주요 유통 채널의 행사 마감일은 11월 29일부터 12월 13일까지 순차적으로 분포되어 있다. 백화점과 대형 가전·디지털 기획전이 가장 먼저 문을 닫고, 패션 플랫폼과 해외 직구 채널이 12월 첫째 주까지 바통을 이어받는다. 아울렛 행사는 12월 중순까지 진행된다.\n\n### 2. 수치로 확인하는 2026 겨울 쇼핑 트렌드\n\n올해 블랙프라이데이 시즌의 소비는 기온 하락과 맞물려 방한 의류와 신발에 압도적으로 집중됐다. 11월 22일 서울 최저기온이 영하 5.8도를 기록하자마자 유통업계 거래액이 폭발적으로 증가했다.\n\n- 외투 및 방한화 중심의 단기 집중 소비: 무신사 '무진장 26 겨울'은 11월 22일 19시 오픈 후 43시간 만인 24일 14시에 누적 판매액 1,000억 원을 돌파했다. 이는 지난해 겨울 행사보다 6시간 단축된 기록이다. 특히 11월 23일 하루 동안 외투(패딩·코트) 거래액만 200억 원, 신발 거래액은 전년 대비 68% 증가한 100억 원을 기록했다. 백화점 역시 신세계백화점 기준 11월 19일부터 24일까지 아웃도어 매출이 전주 같은 요일 대비 35%, 스포츠 부문이 30% 상승했다. 현대백화점은 겨울 정기세일을 맞아 패딩과 코트 물량을 전년 대비 20% 늘렸다.\n- 고가 프리미엄과 실속형 레이어링의 양극화: 고가 시장에서는 50만~110만 원대 프리미엄 다운 제품이 상위권을 차지한 반면, 온라인 실시간 랭킹 1~3위는 4만~7만 원대 경량·미드웨이트 패딩이 휩쓸었다. 11월 24일 오전 8시 기준 무신사 외투 랭킹 상위 9개 품목 중 7개가 패딩이었으며, 이 중 5개는 겹쳐 입기 좋은 미드웨이트·라이트·경량 패딩과 플리스·후드 집업이었다.\n- 롱패딩에서 경량패딩으로의 구조적 변화: 세탁 전문 기업 런드리고가 2023년 9월부터 2026년 11월까지 패딩 세탁 데이터 122만 벌을 분석한 결과, 전체 패딩 중 경량패딩 비중은 7.8%에서 14.6%로 두 배 가까이 늘어난 반면 롱패딩 비중은 26.5%에서 18.7%로 감소했다. 무거운 한 벌보다 실내외 온도 차에 대응하기 쉬운 가벼운 외투를 선호하는 흐름이 뚜렷하다.\n\n### 3. 헷갈리기 쉬운 세 가지 주의사항\n\n첫째, 국가 주도 대규모 쇼핑 행사였던 '코리아 그랜드 페스티벌'은 10월 29일부터 11월 15일까지 진행되어 이미 종료됐다. 현재 진행 중인 행사는 민간 유통사 자체 기획전이다. 둘째, 인기 사이즈와 핵심 컬러는 공식 종료일보다 훨씬 빠르게 품절된다. 코오롱몰의 경우 11월 1일부터 18일까지 다운·패딩 거래액이 전년 동기 대비 3.5배, 본행사(11월 5~18일) 거래액이 2.1배 급증했으며 전체 매출의 79%가 모바일 앱에서 발생했다. 모바일을 통한 빠른 결제가 주류를 이루는 만큼 마감일 직전에는 재고가 남지 않을 가능성이 크다. 셋째, 플랫폼별 추가 혜택을 꼼꼼히 따져야 한다. 오늘의집 '집요한세일'은 최저가 미달 시 차액의 200%를 포인트(최대 1만 포인트)로 보상하며, 쿠팡은 11월 23일부터 27일까지 삼성·LG·인텔 등이 참여하는 브랜드별 라이브 방송을 통해 추가 할인과 경품을 제공한다. 에이블리 '에블프'는 2,000여 개 입점사가 참여해 최대 93%, 알리익스프레스는 최대 70% 할인율을 내걸었다.\n\n### 4. 핵심 요약\n\n2026년 블랙프라이데이 쇼핑은 11월 29일(백화점·쿠팡 가전)과 12월 2일(무신사)을 기점으로 주요 물량이 소진되는 일정이다. 영하권 추위로 패딩과 방한화에 수요가 집중되어 있으므로, 필요한 품목이 있다면 종료일 이틀 전까지 재고와 최종 혜택가를 확인해 결정하는 것이 유리하다.\n\n## 표\n\n| 종료일 | 플랫폼 / 유통사 | 주요 행사명 및 특징 |\n|---|---|---|\n| 11월 29일(일) | 롯데·신세계·현대백화점 | 겨울 정기세일 (롯데 400여 개, 신세계 370여 개 브랜드 참여, 현대 외투 물량 20% 확대) |\n| 11월 29일(일) | 쿠팡 | 가전·디지털 블랙프라이데이 (11/23~27 브랜드 라이브 방송 병행) |\n| 11월 30일(월) | 롯데하이마트 | 연말 가전 결산 할인전 |\n| 11월 30일(월) | 오늘의집 | 집요한세일 (최저가 미달 시 차액 200% 포인트 보상, 최대 1만 포인트) |\n| 11월 30일(월) | 코오롱몰 | 아우터 위크 |\n| 12월 1일(화) | 쿠팡 | R.LUX 패션 기획전 |\n| 12월 2일(수) | 무신사 | 무진장 26 겨울 (인기 상품 1,500여 개, 전국 오프라인 매장 11곳 동시 진행) |\n| 12월 3일(목) | 에이블리 | 에블프 (2,000여 개 입점사 참여, 최대 93% 할인) |\n| 12월 3일(목) | 알리익스프레스 | 블랙프라이데이 프로모션 (최대 70% 할인) |\n| 12월 13일(일) | 신세계사이먼 | 사이먼 블랙 프라이데이 |\n\n## 체크리스트\n\n- [ ] 구매하려는 품목이 속한 플랫폼의 정확한 종료일(11/29~12/13)을 캘린더에 표시했는가?\n- [ ] 표기된 최대 할인율 외에 쿠폰 적용 후 최종 결제 금액을 확인했는가?\n- [ ] 50만 원대 이상 고가 아우터와 4만~7만 원대 레이어링용 경량 패딩 중 실제 활용도가 높은 쪽을 선택했는가?\n- [ ] 모바일 앱 전용 쿠폰이나 라이브 방송 시간대 추가 혜택을 확인했는가?\n- [ ] 단순 변심 시 반품 배송비 및 교환 가능 기간 규정을 읽었는가?\n- [ ] 이미 종료된 행사(코리아 그랜드 페스티벌 등)의 지난 가격 정보와 혼동하지 않았는가?\n\n## 참고 자료\n\n- 뉴스핌 (2026-11-24)\n- 뉴스투데이 (2026-11-25)\n- 뉴시스 (2026-11-25)\n- 아주경제 (2026-11-26)\n- 파이낸셜뉴스 (2026-11-26)\n- 뉴스브라이트 (2026-11-27)",

     "meta": "2,260자 · 표 10행",
     "text": "## 제목\n\n2026 블랙프라이데이 마감일 총정리: 11/29부터 12/13까지 행사 종료일 한눈에 보기\n\n## 본문\n\n올해 블랙프라이데이는 시작일보다 종료일이 중요합니다. 행사가 한 번에 끝나지 않고 11/29부터 12/13까지 나뉘어 끝나기 때문입니다. 아래 순서대로 확인하면 어느 행사를 먼저 봐야 하는지 정리됩니다.\n\n### 1. 행사별 종료일 한눈에 보기\n\n종료일 기준으로 가까운 순서입니다. 쿠팡 가전·디지털과 백화점 겨울 정기세일은 11/29에 닫힙니다. 백화점 세일은 롯데 400여 브랜드, 신세계 370여 브랜드가 참여하고, 현대는 패딩·코트 물량을 전년 대비 20% 늘렸습니다.\n\n### 2. 이번 주 수요를 숫자로 보면\n\n수요는 패딩과 방한 품목에 쏠렸습니다. 무신사는 43시간 만에 1,000억 원을 넘겼고, 이는 지난해 겨울 행사보다 6시간 빠른 속도입니다. 코오롱몰은 11/1~18 다운·패딩 거래액이 전년 동기의 3.5배, 모바일 앱 매출 비중은 79%였습니다. 해석은 세 가지입니다.\n\n- 외투와 방한화에 소비가 집중됐다. 11/23 하루 외투 200억 원, 신발 100억 원(전년 대비 68% 증가)이다.\n- 비싼 한 벌보다 겹쳐 입는 조합이 뜬다. 무신사 외투 상위 9개 중 5개가 레이어링용이다.\n- 기온이 떨어지면 소비가 바로 움직인다. 서울 최저기온이 -5.8도였던 11/22 직후 매출이 치솟았다.\n\n### 3. 결제 전 체크리스트\n\n아래 8개 항목 중 하나라도 비어 있으면 결제를 미루세요.\n\n### 4. 헷갈리기 쉬운 세 가지\n\n첫째, '코리아 그랜드 페스티벌'은 10/29~11/15에 이미 끝났습니다. 둘째, 재고 소진은 마감보다 빠르게 옵니다. 셋째, 롱패딩만 찾으면 흐름을 놓칩니다. 런드리고가 2023년 9월~2026년 11월 패딩 세탁 122만 벌을 분석한 결과, 경량패딩 비중은 7.8%에서 14.6%로 올랐고 롱패딩은 26.5%에서 18.7%로 내렸습니다.\n\n### 5. 정리\n\n- 시작일이 아니라 종료일 순서로 본다.\n- 인기 상품은 마감 전에 사이즈가 먼저 빠진다.\n- 가격 기준은 온라인 랭킹 1~3위 4만~7만원대, 프리미엄 50만~110만원대로 나뉜다.\n\n## 표\n\n| 종료일 | 행사 | 비고 |\n|---|---|---|\n| 11/29 | 쿠팡 가전·디지털 블랙프라이데이 | 11/23~27 브랜드별 라이브 방송 추가 할인·경품(삼성·LG·인텔 참여) |\n| 11/29 | 백화점 겨울 정기세일 | 롯데 400여 브랜드, 신세계 370여 브랜드 |\n| 11/30 | 롯데하이마트 |  |\n| 11/30 | 오늘의집 '집요한세일' | 최저가 미달 시 차액 200% 포인트 보상(최대 1만 포인트) |\n| 11/30 | 코오롱몰 '아우터 위크' |  |\n| 12/1 | 쿠팡 R.LUX 패션 |  |\n| 12/2 | 무신사 '무진장 26 겨울' | 인기 상품 1,500여 개, 전국 오프라인 매장 11곳 동시 진행 |\n| 12/3 | 에이블리 '에블프' | 2,000여 입점사 최대 93% 할인 |\n| 12/3 | 알리익스프레스 | 최대 70% 할인 |\n| 12/13 | 신세계사이먼 '사이먼 블랙 프라이데이' |  |\n\n## 체크리스트\n\n- 할인 전 가격이 평소 가격과 같은지 확인했다\n- 이번 겨울 착용 횟수를 미리 가늠해 봤다\n- 이미 가진 외투와 겹치지 않는다\n- 레이어링이 되는지 안에 입을 옷과 함께 떠올려 봤다\n- 충전재와 무게를 상품 정보에서 직접 확인했다\n- 선택한 행사의 종료일을 달력에 적었다\n- 반품·교환 조건을 읽었다\n- 고정지출과 카드값을 뺀 이번 달 예산 안이다\n\n## 참고 자료\n\n- 뉴스투데이, 2026-11-25\n- 뉴스핌, 2026-11-24\n- 뉴시스, 2026-11-25\n- 아주경제, 2026-11-26\n- 파이낸셜뉴스, 2026-11-26\n- 뉴스브라이트, 2026-11-27",

      if (s && s.sel) {
        Object.keys(state.sel).forEach(function (k) {
          if (s.sel[k]) state.sel[k] = s.sel[k];
        });
      }
      if (s && s.edits) state.edits = s.edits;
      if (s && s.tab) state.tab = s.tab;
    } catch (e) { /* 저장된 값이 깨졌으면 무시하고 기본값으로 시작 */ }
  }
  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function inline(s) {
    return s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
            .replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>")
            .replace(/`([^`]+)`/g, "<code>$1</code>");
  }

  // 아주 가벼운 마크다운 렌더러: 제목, 목록, 표, 구분선, 굵게만 처리한다.
  function render(md) {
    var lines = String(md).replace(/\r/g, "").split("\n");
    var out = [], i = 0;
    function flushList(buf) {
      if (!buf.length) return;
      out.push("<ul>" + buf.map(function (t) { return "<li>" + inline(esc(t)) + "</li>"; }).join("") + "</ul>");
      buf.length = 0;
    }
    var list = [];
    while (i < lines.length) {
      var line = lines[i];
      if (/^\s*\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        flushList(list);
        var head = splitRow(line);
        i += 2;
        var rows = [];
        while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(splitRow(lines[i])); i++; }
        out.push("<table><thead><tr>" + head.map(function (h) { return "<th>" + inline(esc(h)) + "</th>"; }).join("") +
          "</tr></thead><tbody>" + rows.map(function (r) {
            return "<tr>" + r.map(function (c2) { return "<td>" + inline(esc(c2)) + "</td>"; }).join("") + "</tr>";
          }).join("") + "</tbody></table>");
        continue;
      }
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { flushList(list); out.push("<hr>"); i++; continue; }
      var h = line.match(/^\s*(#{1,6})\s+(.*)$/);
      if (h) { flushList(list); var lv = Math.min(h[1].length, 4); out.push("<h" + lv + ">" + inline(esc(h[2])) + "</h" + lv + ">"); i++; continue; }
      var li = line.match(/^\s*(?:[-*]|\d+[.)])\s+(.*)$/);
      if (li) { list.push(li[1]); i++; continue; }
      if (!line.trim()) { flushList(list); i++; continue; }
      flushList(list);
      out.push("<p>" + inline(esc(line)) + "</p>");
      i++;
    }
    flushList(list);
    return out.join("\n");
  }
  function splitRow(line) {
    var t = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    return t.split("|").map(function (c) { return c.trim(); });
  }

  function ch(id) {
    for (var i = 0; i < DATA.channels.length; i++) if (DATA.channels[i].id === id) return DATA.channels[i];
    return null;
  }
  function ver(c, key) {
    for (var i = 0; i < c.versions.length; i++) if (c.versions[i].key === key) return c.versions[i];
    return c.versions[0];
  }
  function finalText(c) {
    if (typeof state.edits[c.id] === "string") return state.edits[c.id];
    return ver(c, state.sel[c.id]).text;
  }
  function isEdited(id) { return typeof state.edits[id] === "string"; }

  function renderTabs() {
    var el = document.getElementById("tabs");
    el.innerHTML = DATA.channels.map(function (c) {
      return '<button class="tab" role="tab" data-tab="' + c.id + '" aria-selected="' + (state.tab === c.id) + '">' +
        c.id + ". " + esc(c.name) + "</button>";
    }).join("");
    Array.prototype.forEach.call(el.querySelectorAll("[data-tab]"), function (b) {
      b.addEventListener("click", function () {
        state.tab = Number(b.getAttribute("data-tab"));
        save(); renderTabs(); renderPanel();
        window.scrollTo({ top: 0, behavior: "smooth" });
      });
    });
  }

  function renderPanel() {
    var c = ch(state.tab);
    var panel = document.getElementById("panel");
    var list = c.versions.map(function (v) {
      var sel = state.sel[c.id] === v.key;
      return '<section class="card' + (sel ? " sel" : "") + (v.key === "pickle" ? " pick" : "") + '" data-key="' + v.key + '">' +
        '<div class="cbar"><span class="badge">' + esc(v.label) + "</span>" +
        '<span class="cmeta">' + esc(v.meta || "") + "</span></div>" +
        '<div class="cbody">' + render(v.text) + "</div>" +
        '<div class="cfoot"><button class="btn ' + (sel ? "on" : "") + '" data-select="' + v.key + '">' +
        (sel ? "✓ 선택됨" : "이 버전 선택") + "</button></div></section>";
    }).join("");

    panel.innerHTML =
      '<div class="chead"><h2>' + c.id + ". " + esc(c.name) + "</h2><span>" + esc(c.sub) + "</span></div>" +
      '<div class="grid">' + list + "</div>" +
      '<div class="editor">' +
      '<h3>선택한 버전 편집 — ' + esc(ver(c, state.sel[c.id]).label) + "</h3>" +
      '<p class="hint">이 칸에서 바로 고치면 아래 선택 결과와 복사본에 그대로 반영됩니다. 다른 버전을 고르면 그 버전 원문으로 바뀝니다.</p>' +
      '<textarea id="editArea" spellcheck="false"></textarea>' +
      '<div class="erow"><button class="btn small" id="resetEdit">이 버전 원문으로 되돌리기</button>' +
      '<button class="btn small" id="copyThis">이 채널만 복사</button>' +
      '<span class="saved" id="savedTag">저장됨</span></div></div>';

    var ta = document.getElementById("editArea");
    ta.value = finalText(c);
    ta.addEventListener("input", function () {
      state.edits[c.id] = ta.value;
      save(); tag(); renderSum();
    });
    function tag() {
      var t = document.getElementById("savedTag");
      t.classList.add("show");
      clearTimeout(tag.tm);
      tag.tm = setTimeout(function () { t.classList.remove("show"); }, 1100);
    }
    document.getElementById("resetEdit").addEventListener("click", function () {
      delete state.edits[c.id];
      ta.value = ver(c, state.sel[c.id]).text;
      save(); renderSum(); toast("원문으로 되돌렸습니다");
    });
    document.getElementById("copyThis").addEventListener("click", function () {
      copy("[채널 " + c.id + ". " + c.name + "]\n\n" + ta.value, c.name + " 복사됨");
    });

    Array.prototype.forEach.call(panel.querySelectorAll("[data-select]"), function (b) {
      b.addEventListener("click", function () {
        var key = b.getAttribute("data-select");
        if (key === state.sel[c.id]) { return; }
        if (isEdited(c.id)) {
          var ask = (typeof window !== "undefined" && typeof window.confirm === "function")
            ? window.confirm("이 채널에 직접 수정한 내용이 있습니다. 다른 버전을 고르면 수정 내용이 사라집니다. 계속할까요?")
            : true;
          if (!ask) { return; }
        }
        state.sel[c.id] = key;
        delete state.edits[c.id];
        save(); renderPanel(); renderSum();
        toast(ver(c, key).label + " 선택");
      });
    });
  }

  function renderSum() {
    var row = document.getElementById("sumrow");
    var picked = 0;
    row.innerHTML = DATA.channels.map(function (c) {
      var v = ver(c, state.sel[c.id]);
      if (state.sel[c.id]) picked++;
      return '<span class="chip">' + c.id + ". " + esc(c.name) + " · <span class=\"who\">" + esc(v.label) + "</span>" +
        (isEdited(c.id) ? " ✏️" : "") +
        '<button data-copy="' + c.id + '">복사</button></span>';
    }).join("");
    document.getElementById("pickCnt").textContent = "(" + picked + "/5 채널 선택 · ✏️는 직접 수정함)";
    Array.prototype.forEach.call(row.querySelectorAll("[data-copy]"), function (b) {
      b.addEventListener("click", function () {
        var c = ch(Number(b.getAttribute("data-copy")));
        copy("[채널 " + c.id + ". " + c.name + "]\n\n" + finalText(c), c.name + " 복사됨");
      });
    });
  }

  function buildAll() {
    var head = "# 2026-11-27 블랙프라이데이 5채널 최종본\n\n" +
      "주제: " + DATA.topic + "\n" +
      "광고·제휴: 없음 (플랫폼 승인·안정권 전까지 순수 정보 글만)\n\n" +
      "| 채널 | 선택 버전 |\n|---|---|\n" +
      DATA.channels.map(function (c) {
        return "| " + c.id + ". " + c.name + " | " + ver(c, state.sel[c.id]).label + (isEdited(c.id) ? " (직접 수정)" : "") + " |";
      }).join("\n") + "\n\n";
    var body = DATA.channels.map(function (c) {
      return "---\n\n## " + c.id + ". " + c.name + "\n\n" + finalText(c).trim();
    }).join("\n\n");
    return head + body + "\n";
  }

  function copy(text, msg) {
    function done() { toast(msg || "복사됨"); }
    function fallback() {
      var t = document.createElement("textarea");
      t.value = text;
      t.style.position = "fixed"; t.style.top = "-1000px";
      document.body.appendChild(t); t.select();
      try { document.execCommand("copy"); done(); } catch (e) { toast("복사 실패 — 직접 선택해 주세요"); }
      document.body.removeChild(t);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else { fallback(); }
  }

  function toast(msg) {
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast.tm);
    toast.tm = setTimeout(function () { t.classList.remove("show"); }, 1500);
  }

  function download() {
    var blob = new Blob([buildAll()], { type: "text/markdown;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "2026-11-27-5ch-final.md";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
    toast("최종본 .md 다운로드");
  }

  function init() {
    document.getElementById("ttl").textContent = DATA.title;
    document.getElementById("sub").innerHTML =
      '<span class="pill">' + DATA.date + '</span>' + esc(DATA.topic) +
      '<br><span style="font-size:12px">ChatGPT는 1차 응답이 형식을 어겨(채널 교체·스레드 평서문) 같은 채팅에서 다시 받았습니다. 아래 ChatGPT 카드는 2차 출력입니다.</span>';
    document.getElementById("promptPre").textContent = DATA.prompt;
    document.getElementById("copyPrompt").addEventListener("click", function () {
      copy(DATA.prompt, "프롬프트 복사됨");
    });
    document.getElementById("copyAll").addEventListener("click", function () {
      copy(buildAll(), "5채널 최종본 전체 복사됨");
    });
    document.getElementById("download").addEventListener("click", download);
    load();
    renderTabs(); renderPanel(); renderSum();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else { init(); }
})();
</script>
</body>
</html>
